// --- AUDIO SYNTHESIZER ---
const AudioEngine = {
  ctx: null,
  init() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.ctx = new AC();
    }
  },
  playTone(freqs, duration, type = 'square', vol = 0.08) {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    freqs.forEach((f, idx) => {
      osc.frequency.setValueAtTime(f, now + idx * (duration / freqs.length));
    });
    gain.gain.setValueAtTime(vol, now);
    gain.gain.linearRampToValueAtTime(0, now + duration);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + duration);
  },
  jump() { this.playTone([160, 480], 0.16, 'square', 0.08); },
  coin() { this.playTone([980, 1320], 0.28, 'sine', 0.1); },
  powerUp() { this.playTone([260, 330, 390, 520, 660, 780], 0.35, 'triangle', 0.12); },
  bump() { this.playTone([200, 80], 0.08, 'triangle', 0.1); },
  stomp() { this.playTone([110, 40], 0.12, 'triangle', 0.12); },
  flame() { this.playTone([540, 220, 110], 0.15, 'sawtooth', 0.06); },
  levelClear() {
    this.playTone([392, 523, 659, 784, 659, 784, 1046], 0.8, 'triangle', 0.15);
  }
};

window.addEventListener('click', () => AudioEngine.init(), { once: true });

window.addEventListener('keydown', (e) => {
  AudioEngine.init();
  if (['ArrowLeft', 'KeyA'].includes(e.code)) keys.left = true;
  if (['ArrowRight', 'KeyD'].includes(e.code)) keys.right = true;
  if (['ArrowUp', 'KeyW', 'Space'].includes(e.code)) keys.jump = true;
  if (['KeyF', 'KeyJ', 'ShiftLeft', 'ShiftRight'].includes(e.code)) {
    if (!keys.action) shootFlame();
    keys.action = true;
  }
});

window.addEventListener('keyup', (e) => {
  if (['ArrowLeft', 'KeyA'].includes(e.code)) keys.left = false;
  if (['ArrowRight', 'KeyD'].includes(e.code)) keys.right = false;
  if (['ArrowUp', 'KeyW', 'Space'].includes(e.code)) keys.jump = false;
  if (['KeyF', 'KeyJ', 'ShiftLeft', 'ShiftRight'].includes(e.code)) keys.action = false;
});

function bindBtn(id, keyName, onPress) {
  const el = document.getElementById(id);
  const p = (e) => {
    e.preventDefault();
    AudioEngine.init();
    keys[keyName] = true;
    el.classList.add('pressed');
    if (onPress) onPress();
  };
  const r = (e) => {
    e.preventDefault();
    keys[keyName] = false;
    el.classList.remove('pressed');
  };
  el.addEventListener('touchstart', p, { passive: false });
  el.addEventListener('touchend', r, { passive: false });
  el.addEventListener('touchcancel', r, { passive: false });
  el.addEventListener('mousedown', p);
  el.addEventListener('mouseup', r);
  el.addEventListener('mouseleave', r);
}

function makeSprite(width, height, map, pal) {
  const c = document.createElement('canvas');
  c.width = width;
  c.height = height;
  const pctx = c.getContext('2d');
  for (let y = 0; y < height; y++) {
    const row = map[y];
    if (!row) continue;
    for (let x = 0; x < width; x++) {
      const ch = row[x];
      if (ch && ch !== '.' && pal[ch]) {
        pctx.fillStyle = pal[ch];
        pctx.fillRect(x, y, 1, 1);
      }
    }
  }
  return c;
}

// --- UPDATE LOOP ---
function update() {
  globalFrame++;

  if (player.invulnTimer > 0) player.invulnTimer--;

  // Victory Sequence
  if (player.finished) {
    player.x += 1.2;
    player.grounded = true;
    player.animTimer += 0.2;
    player.animFrame = Math.floor(player.animTimer) % 2;

    if (level.flag.flagY < 160) {
      level.flag.flagY += 2;
    }

    if (player.x > level.church.x + 30) {
      victory = true;
    }
    return;
  }

  // Horizontal Movement with Smooth Acceleration & Deceleration
  if (keys.left) {
    player.vx -= player.accel;
    player.facingRight = false;
  } else if (keys.right) {
    player.vx += player.accel;
    player.facingRight = true;
  } else {
    player.vx *= player.friction;
    if (Math.abs(player.vx) < 0.05) player.vx = 0;
  }

  // Clamp speed
  player.vx = Math.max(-player.maxSpeed, Math.min(player.maxSpeed, player.vx));
  player.x += player.vx;

  // Jump Action with variable height feel
  if (keys.jump && player.grounded) {
    player.vy = player.jumpPower;
    player.grounded = false;
    AudioEngine.jump();
  }

  // Gravity
  player.vy += 0.28;
  player.y += player.vy;

  // Floor Collision
  const groundY = 200 - (player.powerTier > 0 ? 24 : 16);
  let currentSurfaceY = groundY;

  // Platform collisions
  level.platforms.forEach(plat => {
    const pHeight = player.powerTier > 0 ? 24 : 16;
    if (player.x + 12 > plat.x && player.x + 4 < plat.x + plat.w) {
      if (player.y + pHeight <= plat.y + 6 && player.vy >= 0) {
        currentSurfaceY = Math.min(currentSurfaceY, plat.y - pHeight);
      }
    }
  });

  // Solid Ministry Door Top Collisions
  level.doors.forEach(d => {
    const doorTop = 200 - d.h;
    const pHeight = player.powerTier > 0 ? 24 : 16;
    if (player.x + 12 > d.x && player.x + 4 < d.x + d.w) {
      if (player.y + pHeight <= doorTop + 6 && player.vy >= 0) {
        currentSurfaceY = Math.min(currentSurfaceY, doorTop - pHeight);
      }
    }
  });

  // Block top collisions
  level.blocks.forEach(b => {
    const pHeight = player.powerTier > 0 ? 24 : 16;
    if (player.x + 12 > b.x && player.x + 4 < b.x + 16) {
      if (player.y + pHeight <= b.y + 6 && player.vy >= 0) {
        currentSurfaceY = Math.min(currentSurfaceY, b.y - pHeight);
      }
    }
  });

  // Apply floor limit
  if (player.y >= currentSurfaceY) {
    player.y = currentSurfaceY;
    player.vy = 0;
    player.grounded = true;
  } else {
    player.grounded = false;
  }

  // Block Hit from Below
  level.blocks.forEach(b => {
    if (player.vy < 0 && player.x + 12 > b.x && player.x + 4 < b.x + 16) {
      if (player.y <= b.y + 16 && player.y >= b.y + 8) {
        player.y = b.y + 16;
        player.vy = 0.8;
        b.bounce = -4;
        AudioEngine.bump();

        if (!b.hit) {
          b.hit = true;
          if (b.type === 'faith') {
            if (b.content === 'token') {
              tokens++;
              score += 100;
              AudioEngine.coin();
              level.particles.push({
                type: 'token_float',
                x: b.x + 4,
                y: b.y - 12,
                vy: -3.5,
                timer: 0
              });
            } else if (b.content === 'coffee') {
              level.items.push({
                type: 'coffee',
                x: b.x,
                y: b.y - 16,
                vx: 0.8,
                vy: -2
              });
            } else if (b.content === 'flame') {
              level.items.push({
                type: 'flame',
                x: b.x,
                y: b.y - 16,
                vx: 0.8,
                vy: -2
              });
            }
          }
        }
      }
    }
    if (b.bounce < 0) b.bounce += 0.5;
    else b.bounce = 0;
  });

  // Items Physics & Collection
  for (let i = level.items.length - 1; i >= 0; i--) {
    const item = level.items[i];
    item.vy += 0.25;
    item.x += item.vx;
    item.y += item.vy;

    if (item.y > 184) {
      item.y = 184;
      item.vy = 0;
    }

    // Touch item
    const pH = player.powerTier > 0 ? 24 : 16;
    if (
      player.x + 14 > item.x &&
      player.x + 2 < item.x + 16 &&
      player.y + pH > item.y &&
      player.y < item.y + 16
    ) {
      AudioEngine.powerUp();
      score += 500;
      if (item.type === 'coffee') {
        player.powerTier = Math.max(player.powerTier, 1);
        player.y -= 8; // Adjust height transition
      } else if (item.type === 'flame') {
        player.powerTier = 2;
      }
      level.items.splice(i, 1);
    }
  }

  // Fireballs
  for (let i = fireballs.length - 1; i >= 0; i--) {
    const fb = fireballs[i];
    fb.x += fb.vx;
    fb.vy += 0.22;
    fb.y += fb.vy;

    if (fb.y >= 194) {
      fb.y = 194;
      fb.vy = -2.8;
      fb.bounces++;
    }

    // Hit enemies
    let fbDead = false;
    level.enemies.forEach(e => {
      if (e.alive && Math.abs(fb.x - e.x) < 14 && Math.abs(fb.y - e.y) < 14) {
        e.alive = false;
        e.flatTimer = 40;
        score += 200;
        AudioEngine.stomp();
        fbDead = true;
      }
    });

    if (fbDead || fb.bounces > 3 || fb.x < player.x - 140 || fb.x > player.x + 200) {
      fireballs.splice(i, 1);
    }
  }

  // Enemies Update & Collisions
  level.enemies.forEach(e => {
    if (e.alive) {
      e.x += e.vx;
      if (e.x < 100 || e.x > 1500) e.vx *= -1;

      // Check collision with player
      const pH = player.powerTier > 0 ? 24 : 16;
      if (
        player.x + 12 > e.x &&
        player.x + 4 < e.x + 16 &&
        player.y + pH >= e.y &&
        player.y <= e.y + 16
      ) {
        // Stomp
        if (player.vy > 0 && player.y + pH <= e.y + 8) {
          e.alive = false;
          e.flatTimer = 35;
          player.vy = -3.8;
          score += 200;
          AudioEngine.stomp();
        } else if (player.invulnTimer === 0) {
          // Player hit
          if (player.powerTier > 0) {
            player.powerTier--;
            player.invulnTimer = 60;
            AudioEngine.bump();
          } else {
            // Respawn back a little with grace
            player.x = Math.max(32, player.x - 60);
            player.y = 176;
            player.invulnTimer = 60;
            score = Math.max(0, score - 100);
            AudioEngine.bump();
          }
        }
      }
    } else if (e.flatTimer > 0) {
      e.flatTimer--;
    }
  });

  // Rolling Obstacles
  level.obstacles.forEach(o => {
    o.x += o.vx;
    o.rot += o.vx * 0.1;
    if (o.x < 50 || o.x > 1500) o.vx *= -1;

    // Hit player
    const pH = player.powerTier > 0 ? 24 : 16;
    if (
      Math.abs((player.x + 8) - o.x) < 12 &&
      Math.abs((player.y + pH / 2) - o.y) < 12
    ) {
      if (player.invulnTimer === 0) {
        if (player.powerTier > 0) {
          player.powerTier--;
          player.invulnTimer = 60;
        } else {
          player.x = Math.max(32, player.x - 40);
          player.invulnTimer = 60;
        }
        AudioEngine.bump();
      }
    }
  });

  // Particles update
  for (let i = level.particles.length - 1; i >= 0; i--) {
    const p = level.particles[i];
    p.y += p.vy;
    p.vy += 0.22;
    p.timer++;
    if (p.timer > 28) level.particles.splice(i, 1);
  }

  // Animation cycle
  if (player.grounded && Math.abs(player.vx) > 0.1) {
    player.animTimer += 0.22;
    player.animFrame = Math.floor(player.animTimer) % 2;
  } else {
    player.animFrame = 0;
  }

  // Finish Flag Collision
  if (!player.finished && player.x >= level.flag.x - 8) {
    player.finished = true;
    player.vx = 0;
    AudioEngine.levelClear();
    score += 1500;
  }
}

// --- RENDER ROUTINE ---
function drawSkyGradient(cameraX) {
  // 16-bit dusk church sky: dark steel blue into warm gold sunset glow
  const grad = ctx.createLinearGradient(0, 0, 0, V_HEIGHT);
  grad.addColorStop(0, '#121b29');
  grad.addColorStop(0.65, '#25354e');
  grad.addColorStop(0.88, '#94582f');
  grad.addColorStop(1, '#d88c3a');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

  // Distant Church Silhouette & Cross in background
  const chX = (1300 - cameraX * 0.18);
  ctx.fillStyle = '#1c293c';
  ctx.fillRect(chX, 100, 64, 100);
  ctx.beginPath();
  ctx.moveTo(chX - 10, 100);
  ctx.lineTo(chX + 32, 50);
  ctx.lineTo(chX + 74, 100);
  ctx.fill();
  // Steeple Cross
  ctx.fillStyle = P.gold;
  ctx.fillRect(chX + 30, 24, 4, 26);
  ctx.fillRect(chX + 24, 32, 16, 4);

  // Parallax Hills & Warm Stained-Glass Tone Backdrops
  const hillOffset = -(cameraX * 0.3) % 200;
  for (let hx = hillOffset - 80; hx < V_WIDTH + 80; hx += 140) {
    ctx.fillStyle = '#1e2e42';
    ctx.beginPath();
    ctx.arc(hx, 180, 55, Math.PI, 0);
    ctx.fill();
  }
}

function drawGround(cameraX) {
  // Ground tiles: Dark Steel Blue curb with Burnt Orange brick foundation
  ctx.fillStyle = P.steelLight;
  ctx.fillRect(0, 200, V_WIDTH, 4);
  ctx.fillStyle = P.steelDark;
  ctx.fillRect(0, 204, V_WIDTH, 20);

  ctx.fillStyle = P.orange;
  const tileX = -(cameraX % 16);
  for (let gx = tileX; gx < V_WIDTH; gx += 16) {
    ctx.fillRect(gx + 1, 206, 14, 6);
    ctx.fillRect(gx + 9, 214, 6, 6);
    ctx.fillRect(gx + 1, 214, 6, 6);
  }
}

function render() {
  const cameraX = Math.max(0, player.x - 84);

  drawSkyGradient(cameraX);
  drawGround(cameraX);

  ctx.save();
  ctx.translate(-cameraX, 0);

  // --- CHURCH SANCTUARY AT END OF LEVEL ---
  const ch = level.church;
  ctx.fillStyle = '#212f45';
  ctx.fillRect(ch.x, 80, ch.w, 120);
  ctx.fillStyle = P.orange;
  ctx.beginPath();
  ctx.moveTo(ch.x - 10, 80);
  ctx.lineTo(ch.x + ch.w / 2, 25);
  ctx.lineTo(ch.x + ch.w + 10, 80);
  ctx.fill();
  // Stained Glass Center
  ctx.fillStyle = P.gold;
  ctx.beginPath();
  ctx.arc(ch.x + ch.w / 2, 60, 16, 0, Math.PI * 2);
  ctx.fill();
  // Church Entrance Arch
  ctx.fillStyle = P.steelDark;
  ctx.fillRect(ch.x + 35, 140, 30, 60);
  // Banner
  ctx.fillStyle = P.cream;
  ctx.fillRect(ch.x + 10, 110, 80, 14);
  ctx.fillStyle = P.steelDark;
  ctx.font = 'bold 6px monospace';
  ctx.fillText('FOUNDERY CHURCH', ch.x + 14, 120);

  // --- FINISH LINE FLAG ---
  const fl = level.flag;
  ctx.fillStyle = '#999';
  ctx.fillRect(fl.x, 100, 3, fl.poleH);
  ctx.fillStyle = P.gold;
  ctx.fillRect(fl.x - 2, 96, 7, 5); // gold finial
  // Stylized Foundery "F" Flag
  ctx.fillStyle = P.orange;
  ctx.fillRect(fl.x + 3, fl.flagY, 26, 18);
  ctx.fillStyle = P.gold;
  ctx.font = 'bold 12px sans-serif';
  ctx.fillText('F', fl.x + 10, fl.flagY + 14);

  // --- SIGNS ---
  level.signs.forEach(s => {
    // Post
    ctx.fillStyle = P.wood;
    ctx.fillRect(s.x + 40, s.y + 12, 4, 14);
    // Signboard
    ctx.fillStyle = P.cream;
    ctx.fillRect(s.x, s.y, 88, 14);
    ctx.strokeStyle = P.orange;
    ctx.strokeRect(s.x + 0.5, s.y + 0.5, 87, 13);
    ctx.fillStyle = P.steelDark;
    ctx.font = 'bold 5px monospace';
    ctx.fillText(s.text, s.x + 4, s.y + 9);
  });

  // --- MINISTRY DOORS (Pipes replacement) ---
  level.doors.forEach(d => {
    const doorY = 200 - d.h;
    // Frame
    ctx.fillStyle = d.color;
    ctx.fillRect(d.x, doorY, d.w, d.h);
    ctx.fillStyle = P.cream;
    ctx.fillRect(d.x + 4, doorY + 6, d.w - 8, d.h - 8);
    // Sign on Door
    ctx.fillStyle = P.steelDark;
    ctx.fillRect(d.x + 2, doorY - 10, d.w - 4, 9);
    ctx.fillStyle = P.gold;
    ctx.font = 'bold 5px monospace';
    ctx.fillText(d.label, d.x + 4, doorY - 3);
    // Doorknob
    ctx.fillStyle = P.gold;
    ctx.fillRect(d.x + d.w - 8, doorY + d.h / 2, 3, 3);
  });

  // --- FLOATING PLATFORMS (Bibles / Stage Audio) ---
  level.platforms.forEach(plat => {
    if (plat.type === 'bible') {
      // Holy Bible Platform: Dark Leather with Gold Pages
      ctx.fillStyle = '#421a08';
      ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
      ctx.fillStyle = P.gold;
      ctx.fillRect(plat.x + 2, plat.y + 3, plat.w - 4, plat.h - 6);
      ctx.fillStyle = P.cream;
      ctx.font = 'bold 6px monospace';
      ctx.fillText(plat.label, plat.x + 4, plat.y + 8);
    } else {
      // Stage Audio Equipment Roadcase
      ctx.fillStyle = '#1c222a';
      ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
      ctx.fillStyle = '#8892a0';
      ctx.strokeRect(plat.x + 0.5, plat.y + 0.5, plat.w - 1, plat.h - 1);
      ctx.fillStyle = P.orange;
      ctx.fillRect(plat.x + 4, plat.y + 3, 4, 4);
      ctx.fillStyle = P.gold;
      ctx.fillRect(plat.x + 10, plat.y + 3, 4, 4);
    }
  });

  // --- BLOCKS (FAITH? & Bricks) ---
  level.blocks.forEach(b => {
    const drawY = b.y + b.bounce;
    if (b.type === 'faith') {
      if (b.hit) {
        ctx.fillStyle = '#544638';
        ctx.fillRect(b.x, drawY, 16, 16);
      } else {
        ctx.fillStyle = P.orange;
        ctx.fillRect(b.x, drawY, 16, 16);
        ctx.strokeStyle = P.gold;
        ctx.strokeRect(b.x + 0.5, drawY + 0.5, 15, 15);
        ctx.fillStyle = P.cream;
        ctx.font = 'bold 7px monospace';
        ctx.fillText('FAITH', b.x + 1, drawY + 9);
        ctx.fillStyle = P.gold;
        ctx.fillText('?', b.x + 6, drawY + 15);
      }
    } else {
      // Brick
      ctx.fillStyle = P.steelLight;
      ctx.fillRect(b.x, drawY, 16, 16);
      ctx.strokeStyle = P.steelDark;
      ctx.strokeRect(b.x + 0.5, drawY + 0.5, 15, 15);
      ctx.fillStyle = P.orange;
      ctx.fillRect(b.x + 2, drawY + 4, 5, 2);
      ctx.fillRect(b.x + 9, drawY + 10, 5, 2);
    }
  });

  // --- ITEMS (Coffee / Flame) ---
  level.items.forEach(it => {
    if (it.type === 'coffee') {
      ctx.drawImage(coffeeSprite, it.x, it.y);
    } else if (it.type === 'flame') {
      ctx.drawImage(flameIconSprite, it.x, it.y);
    }
  });

  // --- ENENIES ---
  level.enemies.forEach(e => {
    if (e.alive) {
      if (e.type === 'cable') ctx.drawImage(cableMonster, e.x, e.y);
      else if (e.type === 'battery') ctx.drawImage(batteryMonster, e.x, e.y);
      else if (e.type === 'glitch') ctx.drawImage(glitchMonster, e.x, e.y);
    } else if (e.flatTimer > 0) {
      // Flattened defeat visual
      ctx.fillStyle = P.orange;
      ctx.fillRect(e.x, e.y + 12, 16, 4);
    }
  });

  // --- ROLLING BASKETBALL OBSTACLES ---
  level.obstacles.forEach(o => {
    ctx.save();
    ctx.translate(o.x, o.y);
    ctx.rotate(o.rot);
    ctx.drawImage(basketballSprite, -o.r, -o.r);
    ctx.restore();
  });

  // --- PROJECTILE FIREBALLS ---
  fireballs.forEach(fb => {
    ctx.fillStyle = P.orange;
    ctx.beginPath();
    ctx.arc(fb.x, fb.y, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = P.gold;
    ctx.beginPath();
    ctx.arc(fb.x, fb.y, 2, 0, Math.PI * 2);
    ctx.fill();
  });

  // --- PARTICLES (Glowing "F" Tokens) ---
  level.particles.forEach(p => {
    if (p.type === 'token_float') {
      ctx.fillStyle = P.gold;
      ctx.font = 'bold 12px sans-serif';
      ctx.fillText('F', p.x, p.y);
    }
  });

  // --- PLAYER MEDIA VOLUNTEER ---
  if (player.invulnTimer % 4 < 2) {
    let sprite;
    if (player.powerTier > 0) {
      sprite = !player.grounded ? volBigJump : (player.animFrame === 1 ? volBigRun1 : volBigJump);
    } else {
      sprite = !player.grounded ? volSmallJump : (player.animFrame === 1 ? volSmallRun2 : volSmallRun1);
    }

    ctx.save();
    if (!player.facingRight) {
      ctx.translate(player.x + 16, player.y);
      ctx.scale(-1, 1);
      ctx.drawImage(sprite, 0, 0);
    } else {
      ctx.drawImage(sprite, player.x, player.y);
    }
    ctx.restore();
  }

  ctx.restore();

  // --- RETRO 16-BIT HUD OVERLAY ---
  ctx.fillStyle = P.gold;
  ctx.font = 'bold 8px monospace';
  ctx.fillText('VOLUNTEER', 14, 14);
  ctx.fillStyle = P.cream;
  ctx.fillText(String(score).padStart(6, '0'), 14, 23);

  // Glowing "F" Token Counter
  ctx.fillStyle = P.orange;
  ctx.fillRect(86, 15, 6, 8);
  ctx.fillStyle = P.gold;
  ctx.font = 'bold 8px sans-serif';
  ctx.fillText('F', 87, 22);
  ctx.fillStyle = P.cream;
  ctx.font = 'bold 8px monospace';
  ctx.fillText('×' + String(tokens).padStart(2, '0'), 96, 23);

  // Foundery World Indicator
  ctx.fillStyle = P.gold;
  ctx.fillText('FOUNDERY', 146, 14);
  ctx.fillStyle = P.cream;
  ctx.fillText('STAGE 1-1', 146, 23);

  // Power Up Status
  ctx.fillStyle = P.gold;
  ctx.fillText('POWER', 204, 14);
  ctx.fillStyle = P.orange;
  ctx.fillText(player.powerTier === 2 ? 'FLAME' : (player.powerTier === 1 ? 'COFFEE' : 'NORMAL'), 204, 23);

  // Victory Card
  if (victory) {
    ctx.fillStyle = 'rgba(15, 20, 29, 0.88)';
    ctx.fillRect(32, 50, 192, 110);
    ctx.strokeStyle = P.gold;
    ctx.lineWidth = 2;
    ctx.strokeRect(32, 50, 192, 110);

    ctx.fillStyle = P.orange;
    ctx.font = 'bold 11px monospace';
    ctx.fillText('STAGE COMPLETED!', 52, 75);

    ctx.fillStyle = P.cream;
    ctx.font = 'bold 7px monospace';
    ctx.fillText('SUNDAYS ARE JUST THE START', 44, 96);
    ctx.fillText('MORE THAN A SUNDAY CHURCH', 46, 110);

    ctx.fillStyle = P.gold;
    ctx.fillText(`FINAL SCORE: ${score}`, 68, 134);
  }
}

// --- MAIN ANIMATION TICK ---
function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>

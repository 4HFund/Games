<style>

  :root {
    --steel-900: #0d1522;

  .title-group {

  .title-group h1 {

    background: linear-gradient(180deg, #fff 0%, var(--gold-400) 45%, var(--orange-500) 100%);

    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 2px 0px #000);
  }

  .title-group span {
    font-size: clamp(7px, 1.7vw, 9px);

    text-shadow: 1px 1px 0 #000;

  .badge {
    background: var(--orange-500);
    color: #fff;
    font-size: 8px;
    padding: 5px 8px;
    border-radius: 4px;
    border: 1px solid var(--gold-400);
    box-shadow: 0 0 8px var(--orange-glow);
  }

  /* CRT Screen Bezel */
  #screen-bezel {
    position: relative;
    width: 100%;
    background: #000;
    border: 4px solid #3a4b64;
    border-radius: 0 0 10px 10px;
    box-shadow: 0 16px 40px rgba(0,0,0,0.9), 0 0 30px var(--orange-glow);
    aspect-ratio: 4 / 3;
    overflow: hidden;
  }

  canvas {
    width: 100%;
    height: 100%;
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  /* Retro Scanline Overlay */
  #screen-bezel::after {
    content: " ";
    position: absolute;
    inset: 0;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),

  /* Mobile Touch Controls */
  #controls {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;

    touch-action: none;

  .btn {

  .btn:active, .btn.pressed {

    border-color: var(--orange-400);
    background: radial-gradient(circle at 35% 35%, #222f42 0%, #121a26 100%);
  }

  .action-btns {

<script>
// --- CANVAS & 16-BIT RENDERER (400 x 300 Resolution) ---
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;

// --- REFINED AUDIO SYNTHESIS ---
const Sound = {
  ctx: null,
  init() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.ctx = new AC();
    }
  },
  play(freqs, duration, type = 'square', vol = 0.08) {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    const step = duration / freqs.length;
    freqs.forEach((f, i) => osc.frequency.setValueAtTime(f, now + i * step));
    gain.gain.setValueAtTime(vol, now);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + duration);
  },
  jump() { this.play([180, 240, 360, 520], 0.18, 'sine', 0.12); },
  coin() { this.play([988, 1318], 0.28, 'triangle', 0.1); },
  power() { this.play([262, 330, 392, 523, 659, 784], 0.35, 'triangle', 0.15); },
  bump() { this.play([120, 80], 0.09, 'sawtooth', 0.1); },
  stomp() { this.play([140, 60], 0.14, 'triangle', 0.15); },
  flame() { this.play([600, 320, 160], 0.15, 'sawtooth', 0.08); },
  win() { this.play([440, 554, 659, 880, 1108], 0.6, 'triangle', 0.16); }
};

window.addEventListener('click', () => Sound.init(), { once: true });
window.addEventListener('touchstart', () => Sound.init(), { once: true });

// --- INPUTS (Desktop & Mobile) ---
const keys = { left: false, right: false, jump: false, action: false };

window.addEventListener('keydown', (e) => {
  Sound.init();
  if (['ArrowLeft', 'KeyA'].includes(e.code)) keys.left = true;
  if (['ArrowRight', 'KeyD'].includes(e.code)) keys.right = true;
  if (['ArrowUp', 'KeyW', 'Space'].includes(e.code)) keys.jump = true;
  if (['KeyF', 'KeyJ', 'ShiftLeft', 'ShiftRight'].includes(e.code)) {
    if (!keys.action) shootFlame();
    keys.action = true;
  }
});

window.addEventListener('keyup', (e) => {
  if (['ArrowLeft', 'KeyA'].includes(e.code)) keys.left = false;
  if (['ArrowRight', 'KeyD'].includes(e.code)) keys.right = false;
  if (['ArrowUp', 'KeyW', 'Space'].includes(e.code)) keys.jump = false;
  if (['KeyF', 'KeyJ', 'ShiftLeft', 'ShiftRight'].includes(e.code)) keys.action = false;
});

function bindBtn(id, key, onPress) {
  const el = document.getElementById(id);
  const p = (e) => {
    e.preventDefault();
    Sound.init();
    keys[key] = true;
    el.classList.add('pressed');
    if (onPress) onPress();
  };
  const r = (e) => {
    e.preventDefault();
    keys[key] = false;
    el.classList.remove('pressed');
  };
  el.addEventListener('touchstart', p, { passive: false });
  el.addEventListener('touchend', r, { passive: false });
  el.addEventListener('touchcancel', r, { passive: false });
  el.addEventListener('mousedown', p);
  el.addEventListener('mouseup', r);
  el.addEventListener('mouseleave', r);
}

bindBtn('btn-left', 'left');
bindBtn('btn-right', 'right');
bindBtn('btn-jump', 'jump');
bindBtn('btn-action', 'action', () => shootFlame());

// --- GAME WORLD DATA ---
const LEVEL_LEN = 2400;
let score = 0;
let tokens = 0;
let victory = false;
let globalTick = 0;

// Sub-pixel platforming player with tight inertia
const player = {
  x: 40,
  y: 220,
  vx: 0,
  vy: 0,
  acc: 0.35,
  fric: 0.84,
  maxSpeed: 3.2,
  jumpStrength: -6.8,
  grounded: true,
  facingRight: true,
  tier: 0, // 0: Normal, 1: Coffee Big, 2: Flame Pro
  invuln: 0,
  animTick: 0,
  finished: false
};

const fireballs = [];

function shootFlame() {
  if (player.tier < 2 || fireballs.length >= 3 || player.finished) return;
  Sound.flame();
  fireballs.push({
    x: player.facingRight ? player.x + 22 : player.x - 6,
    y: player.y + (player.tier > 0 ? 12 : 6),
    vx: player.facingRight ? 5.2 : -5.2,
    vy: 1.2,
    bounces: 0
  });
}

      { type: 'ball', x: 680,  y: 244, vx: -1.4, r: 8, rot: 0 },

    ],

}

let world = buildWorld();

// --- HIGH-FIDELITY VECTOR PIXEL DRAWING HELPERS ---

// Media Volunteer: Detailed 16-bit Church Tech Hero
function drawVolunteer(ctx, x, y, tier, facingRight, moving, grounded, tick) {
  ctx.save();
  ctx.translate(x + (facingRight ? 0 : (tier > 0 ? 22 : 18)), y);
  if (!facingRight) ctx.scale(-1, 1);

  const bob = grounded && moving ? Math.sin(tick * 0.35) * 2 : 0;
  const legSwing = grounded && moving ? Math.sin(tick * 0.35) * 5 : 0;
  const isJump = !grounded;

  const h = tier > 0 ? 30 : 22;
  const w = tier > 0 ? 20 : 16;

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(w/2, h + 2, w/2 + 2, 3, 0, 0, Math.PI * 2);
  ctx.fill();

  // Shoes
  ctx.fillStyle = '#1c1510';
  ctx.fillRect(isJump ? 2 : 2 - legSwing, h - 2 + bob, 6, 4);
  ctx.fillRect(isJump ? w - 7 : w - 7 + legSwing, h - 2 + bob, 6, 4);

  // Jeans (Steel Blue)
  ctx.fillStyle = '#223854';
  ctx.fillRect(3, h - 10 + bob, w - 6, 8);
  ctx.fillStyle = '#17273c';
  ctx.fillRect(w/2 - 1, h - 9 + bob, 2, 8); // Seam

  // Shirt (Dark Steel Blue with subtle highlight)
  ctx.fillStyle = tier === 2 ? '#e85d1d' : '#2d4360';
  ctx.fillRect(2, h - 20 + bob, w - 4, 11);
  ctx.fillStyle = tier === 2 ? '#ffa173' : '#3f5d84';
  ctx.fillRect(4, h - 20 + bob, 3, 11); // Fabric Highlight

  // Skin (Neck & Face)
  ctx.fillStyle = '#ffd1a4';
  ctx.fillRect(w/2 - 2, h - 22 + bob, 4, 3);
  ctx.fillRect(3, h - 30 + bob, w - 6, 9);

  // Friendly Face details
  ctx.fillStyle = '#3a2010';
  ctx.fillRect(w - 7, h - 27 + bob, 2, 3); // Eye
  ctx.fillStyle = '#d87060';
  ctx.fillRect(w - 7, h - 23 + bob, 3, 1.5); // Smile

  // Headset Boom Mic & Ear Cup
  ctx.fillStyle = '#111';
  ctx.fillRect(3, h - 29 + bob, 3, 6); // Ear pad
  ctx.strokeStyle = '#222';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(w/2 - 1, h - 30 + bob, w/2 - 2, Math.PI, 0); // Headband
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(4, h - 25 + bob);
  ctx.lineTo(w - 4, h - 22 + bob); // Boom
  ctx.stroke();
  ctx.fillStyle = '#ff7836';
  ctx.fillRect(w - 4, h - 23 + bob, 2, 2); // Mic wind foam

  // Burnt-Orange Cap (Foundery Style)
  ctx.fillStyle = '#e85d1d';
  ctx.fillRect(2, h - 34 + bob, w - 4, 5);
  ctx.fillRect(w - 4, h - 31 + bob, 6, 2.5); // Brim
  ctx.fillStyle = '#ff925c';
  ctx.fillRect(4, h - 34 + bob, w - 8, 2); // Cap highlight

  // Flame Power-Up Aura
  if (tier === 2) {
    ctx.strokeStyle = 'rgba(255, 201, 51, 0.6)';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(-2, -4 + bob, w + 4, h + 6);
  }

  ctx.restore();
}

// 16-Bit FAITH? Block
function drawFaithBlock(ctx, x, y, hit, bounce, tick) {
  const by = y + bounce;
  if (hit) {
    ctx.fillStyle = '#3a3530';
    ctx.fillRect(x, by, 20, 20);
    ctx.fillStyle = '#221f1c';
    ctx.strokeRect(x + 0.5, by + 0.5, 19, 19);
    ctx.fillStyle = '#181513';
    ctx.fillRect(x + 2, by + 2, 3, 3);
    ctx.fillRect(x + 15, by + 2, 3, 3);
    ctx.fillRect(x + 2, by + 15, 3, 3);
    ctx.fillRect(x + 15, by + 15, 3, 3);
  } else {
    // Golden Orange Glowing Block
    const pulse = Math.sin(tick * 0.1) * 0.15;
    ctx.fillStyle = '#e85d1d';
    ctx.fillRect(x, by, 20, 20);

    // Bevel highlights
    ctx.fillStyle = '#ff985a';
    ctx.fillRect(x, by, 20, 2);
    ctx.fillRect(x, by, 2, 20);
    ctx.fillStyle = '#9e3406';
    ctx.fillRect(x, by + 18, 20, 2);
    ctx.fillRect(x + 18, by, 2, 20);

    // Inner gold badge
    ctx.fillStyle = '#ffd040';
    ctx.fillRect(x + 3, by + 3, 14, 14);
    ctx.fillStyle = '#b38200';
    ctx.fillRect(x + 3, by + 15, 14, 2);

    // "FAITH?" embossed lettering
    ctx.fillStyle = '#fff';
    ctx.font = '6px "Press Start 2P", monospace';
    ctx.fillText('F', x + 5, by + 12);
    ctx.fillStyle = '#9e3406';
    ctx.fillText('?', x + 11, by + 13);
  }
}

// 16-Bit Sound / Bible Floating Platform
function drawPlatform(ctx, plat) {
  if (plat.type === 'bible') {
    // Elegant Bible with Gold Edge
    ctx.fillStyle = '#2d1608';
    ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
    // Gold Page Edges
    ctx.fillStyle = '#ffcf40';
    ctx.fillRect(plat.x + 3, plat.y + 4, plat.w - 6, plat.h - 7);
    ctx.fillStyle = '#b88900';
    ctx.fillRect(plat.x + 3, plat.y + plat.h - 3, plat.w - 6, 1);
    // Ribbon Bookmark
    ctx.fillStyle = '#e85d1d';
    ctx.fillRect(plat.x + plat.w / 2 - 2, plat.y, 4, plat.h + 5);
    // Typography
    ctx.fillStyle = '#ffea9f';
    ctx.font = '5px "Press Start 2P"';
    ctx.fillText('HOLY BIBLE', plat.x + 8, plat.y + 9);
  } else {
    // Pro Stage Truss / Road Case
    ctx.fillStyle = '#1c2533';
    ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
    ctx.strokeStyle = '#5a7398';
    ctx.lineWidth = 1;
    ctx.strokeRect(plat.x + 0.5, plat.y + 0.5, plat.w - 1, plat.h - 1);
    // Chrome Corner Caps
    ctx.fillStyle = '#9cb4d8';
    ctx.fillRect(plat.x, plat.y, 4, 4);
    ctx.fillRect(plat.x + plat.w - 4, plat.y, 4, 4);
    ctx.fillRect(plat.x, plat.y + plat.h - 4, 4, 4);
    ctx.fillRect(plat.x + plat.w - 4, plat.y + plat.h - 4, 4, 4);
    // Title
    ctx.fillStyle = '#ffd040';
    ctx.font = '5px "Press Start 2P"';
    ctx.fillText(plat.title, plat.x + 8, plat.y + 9);
  }
}

// Ministry Door (Pipe alternative)
function drawMinistryDoor(ctx, d) {
  const dy = 260 - d.h;
  // Outer Arch Frame
  ctx.fillStyle = d.col;
  ctx.fillRect(d.x, dy, d.w, d.h);
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  ctx.fillRect(d.x, dy, d.w, 3);
  ctx.fillRect(d.x, dy, 3, d.h);

  // Door Inset
  ctx.fillStyle = '#fbf5e6';
  ctx.fillRect(d.x + 4, dy + 8, d.w - 8, d.h - 8);
  ctx.fillStyle = '#ded3be';
  ctx.fillRect(d.x + 6, dy + 12, (d.w - 14)/2, d.h - 18);
  ctx.fillRect(d.x + d.w/2 + 1, dy + 12, (d.w - 14)/2, d.h - 18);

  // Department Sign Plaque
  ctx.fillStyle = '#1b2432';
  ctx.fillRect(d.x - 2, dy - 12, d.w + 4, 11);
  ctx.strokeStyle = '#ffd040';
  ctx.strokeRect(d.x - 1.5, dy - 11.5, d.w + 3, 10);
  ctx.fillStyle = '#ffd040';
  ctx.font = '5px "Press Start 2P"';
  ctx.fillText(d.label, d.x + 2, dy - 4);

  // Brass Handle
  ctx.fillStyle = '#ffcf40';
  ctx.beginPath();
  ctx.arc(d.x + d.w - 8, dy + d.h/2 + 2, 2.5, 0, Math.PI * 2);
  ctx.fill();
}

// Sunday Morning Monster: Tangled Cable
function drawCableMonster(ctx, e, tick) {
  const squish = e.squish > 0 ? 0.3 : 1;
  ctx.save();
  ctx.translate(e.x + 9, e.y + 16);
  ctx.scale(1, squish);

  // Tangled loops
  ctx.strokeStyle = '#222f42';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(0, -9, 8, 0, Math.PI * 2);
  ctx.stroke();
  ctx.strokeStyle = '#e85d1d'; // Audio patch cable
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.arc(-2, -8, 6, 0, Math.PI * 2);
  ctx.stroke();

  // Angry Eyes
  ctx.fillStyle = '#fff';
  ctx.fillRect(-6, -12, 4, 4);
  ctx.fillRect(2, -12, 4, 4);
  ctx.fillStyle = '#c82828';
  ctx.fillRect(-4, -11, 2, 2);
  ctx.fillRect(4, -11, 2, 2);
  ctx.restore();
}

// Sunday Morning Monster: Dead Battery
function drawBatteryMonster(ctx, e, tick) {
  const squish = e.squish > 0 ? 0.3 : 1;
  ctx.save();
  ctx.translate(e.x, e.y + 16);
  ctx.scale(1, squish);

  // Battery Body
  ctx.fillStyle = '#1c2430';
  ctx.fillRect(0, -16, 16, 16);
  ctx.fillStyle = '#999';
  ctx.fillRect(5, -19, 6, 3); // Terminal Nub

  // Red Dead Charge Bar
  ctx.fillStyle = '#c82828';
  ctx.fillRect(2, -14, 12, 5);
  ctx.fillStyle = '#fff';
  ctx.font = '5px "Press Start 2P"';
  ctx.fillText('0%', 3, -4);

  // X_X Eyes
  ctx.fillStyle = '#ff7836';
  ctx.fillText('x', 2, -9);
  ctx.fillText('x', 9, -9);
  ctx.restore();
}

// Sunday Morning Monster: Technical Glitch
function drawGlitchMonster(ctx, e, tick) {
  const squish = e.squish > 0 ? 0.3 : 1;
  ctx.save();
  ctx.translate(e.x, e.y + 16);
  ctx.scale(1, squish);

  ctx.fillStyle = '#5c2a7a';
  ctx.fillRect(0, -16, 16, 16);

  // Glitch Scan artifacts
  const jitter = Math.sin(tick * 0.5) * 3;
  ctx.fillStyle = '#ffc933';
  ctx.fillRect(jitter, -12, 16, 3);
  ctx.fillStyle = '#00d4ff';
  ctx.fillRect(-jitter, -7, 16, 2);

  ctx.fillStyle = '#fff';
  ctx.font = '5px "Press Start 2P"';
  ctx.fillText('ERR', 2, -2);
  ctx.restore();
}

// Power-Up: Fresh Steaming Coffee
function drawCoffee(ctx, x, y, tick) {
  // Steam particles
  const steam = Math.sin(tick * 0.2) * 2;
  ctx.strokeStyle = 'rgba(255,255,255,0.7)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(x + 5 + steam, y - 2);
  ctx.lineTo(x + 5 - steam, y - 7);
  ctx.moveTo(x + 11 - steam, y - 2);
  ctx.lineTo(x + 11 + steam, y - 7);
  ctx.stroke();

  // Ceramic Mug
  ctx.fillStyle = '#fff5e0';
  ctx.fillRect(x + 2, y, 12, 14);
  ctx.fillStyle = '#e85d1d'; // Foundery Accent
  ctx.fillRect(x + 2, y + 5, 12, 3);
  // Handle
  ctx.strokeStyle = '#fff5e0';
  ctx.lineWidth = 2;
  ctx.strokeRect(x + 13, y + 2, 4, 8);
}

// Power-Up: Holy Flame Emblem
function drawFlameIcon(ctx, x, y, tick) {
  const scale = 1 + Math.sin(tick * 0.2) * 0.1;
  ctx.save();
  ctx.translate(x + 8, y + 8);
  ctx.scale(scale, scale);

  ctx.fillStyle = '#ffc933';
  ctx.beginPath();
  ctx.arc(0, 0, 9, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#e85d1d';
  ctx.beginPath();
  ctx.moveTo(0, -7);
  ctx.quadraticCurveTo(6, -1, 4, 6);
  ctx.quadraticCurveTo(0, 7, -4, 6);
  ctx.quadraticCurveTo(-6, -1, 0, -7);
  ctx.fill();

  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(0, 3, 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

// Glowing "F" Token
function drawToken(ctx, x, y, tick) {
  const spin = Math.abs(Math.sin(tick * 0.1));
  ctx.save();
  ctx.translate(x + 8, y + 8);
  ctx.scale(spin, 1);

  ctx.fillStyle = '#ff9838';
  ctx.beginPath();
  ctx.arc(0, 0, 7, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#ffd040';
  ctx.beginPath();
  ctx.arc(0, 0, 5, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#7a2800';
  ctx.font = 'bold 7px "Outfit", sans-serif';
  ctx.fillText('F', -3, 3);
  ctx.restore();
}

// --- GAME LOGIC UPDATE ---
function update() {
  globalTick++;
  if (player.invuln > 0) player.invuln--;

  // Victory walk into Sanctuary
  if (player.finished) {
    player.x += 1.4;
    player.grounded = true;
    player.animTick++;

    if (world.flag.flagY < 235) world.flag.flagY += 2;

    if (player.x > world.sanctuary.x + 45) {
      victory = true;
    }
    return;
  }

  // Smooth Horizontal Momentum
  if (keys.left) {
    player.vx -= player.acc;
    player.facingRight = false;
  } else if (keys.right) {
    player.vx += player.acc;
    player.facingRight = true;
  } else {
    player.vx *= player.fric;
    if (Math.abs(player.vx) < 0.08) player.vx = 0;
  }

  player.vx = Math.max(-player.maxSpeed, Math.min(player.maxSpeed, player.vx));
  player.x += player.vx;
  if (player.x < 0) player.x = 0;

  // Jump Logic
  if (keys.jump && player.grounded) {
    player.vy = player.jumpStrength;
    player.grounded = false;
    Sound.jump();
  }

  // Gravity
  player.vy += 0.32;
  player.y += player.vy;

  const pH = player.tier > 0 ? 30 : 22;
  const pW = player.tier > 0 ? 20 : 16;
  let floorY = 260 - pH;

  // Platform Landings
  world.platforms.forEach(plat => {
    if (player.x + pW > plat.x && player.x < plat.x + plat.w) {
      if (player.y + pH <= plat.y + 7 && player.vy >= 0) {
        floorY = Math.min(floorY, plat.y - pH);
      }
    }
  });

  // Door Top Landings
  world.doors.forEach(d => {
    const doorTop = 260 - d.h;
    if (player.x + pW > d.x && player.x < d.x + d.w) {
      if (player.y + pH <= doorTop + 7 && player.vy >= 0) {
        floorY = Math.min(floorY, doorTop - pH);
      }
    }
  });

  // Block Top Landings
  world.blocks.forEach(b => {
    if (player.x + pW > b.x && player.x < b.x + 20) {
      if (player.y + pH <= b.y + 7 && player.vy >= 0) {
        floorY = Math.min(floorY, b.y - pH);
      }
    }
  });

  if (player.y >= floorY) {
    player.y = floorY;
    player.vy = 0;
    player.grounded = true;
  } else {
    player.grounded = false;
  }

  // Under-block Bump Detection
  world.blocks.forEach(b => {
    if (player.vy < 0 && player.x + pW > b.x && player.x < b.x + 20) {
      if (player.y <= b.y + 20 && player.y >= b.y + 10) {
        player.y = b.y + 20;
        player.vy = 1;
        b.bounce = -6;
        Sound.bump();

        if (!b.hit) {
          b.hit = true;
          if (b.type === 'faith') {
            if (b.item === 'token') {
              tokens++;
              score += 100;
              Sound.coin();
              world.particles.push({ type: 'token', x: b.x + 2, y: b.y - 14, vy: -3.8, life: 0 });
            } else if (b.item === 'coffee') {
              world.items.push({ type: 'coffee', x: b.x + 2, y: b.y - 18, vx: 0.8, vy: -2 });
            } else if (b.item === 'flame') {
              world.items.push({ type: 'flame', x: b.x + 2, y: b.y - 18, vx: 0.8, vy: -2 });
            }
          }
        }
      }
    }
    if (b.bounce < 0) b.bounce += 0.7;
    else b.bounce = 0;
  });

  // Item Collection
  for (let i = world.items.length - 1; i >= 0; i--) {
    const it = world.items[i];
    it.vy += 0.25;
    it.x += it.vx;
    it.y += it.vy;
    if (it.y > 244) { it.y = 244; it.vy = 0; }

    if (player.x + pW > it.x && player.x < it.x + 16 && player.y + pH > it.y && player.y < it.y + 16) {
      Sound.power();
      score += 500;
      if (it.type === 'coffee') player.tier = Math.max(player.tier, 1);
      if (it.type === 'flame') player.tier = 2;
      world.items.splice(i, 1);
    }
  }

  // Projectile Fireballs
  for (let i = fireballs.length - 1; i >= 0; i--) {
    const fb = fireballs[i];
    fb.x += fb.vx;
    fb.vy += 0.25;
    fb.y += fb.vy;

    if (fb.y >= 254) {
      fb.y = 254;
      fb.vy = -3.2;
      fb.bounces++;
    }

    let kill = false;
    world.enemies.forEach(e => {
      if (e.alive && Math.abs(fb.x - (e.x + 8)) < 14 && Math.abs(fb.y - (e.y + 8)) < 14) {
        e.alive = false;
        e.squish = 40;
        score += 200;
        Sound.stomp();
        kill = true;
      }
    });

    if (kill || fb.bounces > 3 || Math.abs(fb.x - player.x) > 300) {
      fireballs.splice(i, 1);
    }
  }

  // Enemies Patrol & Stomp
  world.enemies.forEach(e => {
    if (e.alive) {
      e.x += e.vx;
      if (e.x < 100 || e.x > LEVEL_LEN - 100) e.vx *= -1;

      // Player Collision
      if (player.x + pW > e.x && player.x < e.x + 18 && player.y + pH >= e.y && player.y <= e.y + 18) {
        // Jump Stomp
        if (player.vy > 0 && player.y + pH <= e.y + 9) {
          e.alive = false;
          e.squish = 35;
          player.vy = -4.5;
          score += 200;
          Sound.stomp();
        } else if (player.invuln === 0) {
          // Take Damage
          if (player.tier > 0) {
            player.tier--;
            player.invuln = 70;
            Sound.bump();
          } else {
            player.x = Math.max(40, player.x - 50);
            player.invuln = 70;
            score = Math.max(0, score - 150);
            Sound.bump();
          }
        }
      }
    } else if (e.squish > 0) {
      e.squish--;
    }
  });

  // Obstacles (Rolling basketballs & flight cases)
  world.obstacles.forEach(o => {
    o.x += o.vx;
    if (o.type === 'ball') o.rot += o.vx * 0.12;
    if (o.x < 100 || o.x > LEVEL_LEN - 100) o.vx *= -1;

    if (Math.abs((player.x + pW/2) - o.x) < 14 && Math.abs((player.y + pH/2) - o.y) < 14) {
      if (player.invuln === 0) {
        if (player.tier > 0) player.tier--;
        else player.x = Math.max(40, player.x - 40);
        player.invuln = 70;
        Sound.bump();
      }
    }
  });

  // Token float particles
  for (let i = world.particles.length - 1; i >= 0; i--) {
    const p = world.particles[i];
    p.y += p.vy;
    p.vy += 0.2;
    p.life++;
    if (p.life > 25) world.particles.splice(i, 1);
  }

  // Animation cycle
  if (player.grounded && Math.abs(player.vx) > 0.1) {
    player.animTick++;
  } else {
    player.animTick = 0;
  }

  // Flag Check
  if (!player.finished && player.x >= world.flag.x - 10) {
    player.finished = true;
    player.vx = 0;
    Sound.win();
    score += 2000;
  }
}

// --- PARALLAX BACKGROUND & SCENERY RENDER ---
function drawParallax(camX) {
  // 16-Bit Dusk Sky: Royal Navy Blue into Sunset Amber
  const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
  skyGrad.addColorStop(0, '#0c1626');
  skyGrad.addColorStop(0.55, '#1e324d');
  skyGrad.addColorStop(0.85, '#914924');
  skyGrad.addColorStop(1, '#df7a32');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H);

  // Distant Sun Rays
  ctx.fillStyle = 'rgba(255, 201, 51, 0.08)';
  ctx.beginPath();
  ctx.moveTo(W/2, 0);
  ctx.lineTo(W/2 - 90, H);
  ctx.lineTo(W/2 - 40, H);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(W/2, 0);
  ctx.lineTo(W/2 + 40, H);
  ctx.lineTo(W/2 + 100, H);
  ctx.fill();

  // Distant Church Sanctuary Silhouettes (0.15x parallax)
  const distChurchX = (1800 - camX * 0.15);
  ctx.fillStyle = '#172233';
  ctx.fillRect(distChurchX, 110, 80, 150);
  ctx.beginPath();
  ctx.moveTo(distChurchX - 10, 110);
  ctx.lineTo(distChurchX + 40, 50);
  ctx.lineTo(distChurchX + 90, 110);
  ctx.fill();
  // Steeple Cross
  ctx.fillStyle = '#ffc933';
  ctx.fillRect(distChurchX + 38, 20, 4, 30);
  ctx.fillRect(distChurchX + 30, 28, 20, 4);

  // Far rolling hills (0.3x parallax)
  const hillFar = -(camX * 0.3) % 240;
  ctx.fillStyle = '#1e2e44';
  for (let x = hillFar - 120; x < W + 120; x += 180) {
    ctx.beginPath();
    ctx.arc(x, 260, 90, Math.PI, 0);
    ctx.fill();
  }

  // Near tree line (0.5x parallax)
  const trees = -(camX * 0.5) % 180;
  ctx.fillStyle = '#263b57';
  for (let x = trees - 80; x < W + 80; x += 110) {
    ctx.beginPath();
    ctx.arc(x, 260, 45, Math.PI, 0);
    ctx.fill();
  }

  // Modern Church Platform Ground
  ctx.fillStyle = '#22344f';
  ctx.fillRect(0, 260, W, 6);
  ctx.fillStyle = '#0d1522';
  ctx.fillRect(0, 266, W, 34);

  // Burnt-Orange & Gold Paver Trim
  const paverOffset = -(camX % 20);
  ctx.fillStyle = '#e85d1d';
  for (let gx = paverOffset; gx < W; gx += 20) {
    ctx.fillRect(gx + 1, 268, 18, 8);
    ctx.fillRect(gx + 10, 278, 8, 8);
    ctx.fillRect(gx + 1, 278, 8, 8);
  }
}

// --- MASTER RENDER ---
function render() {
  const camX = Math.max(0, player.x - 110);

  drawParallax(camX);

  ctx.save();
  ctx.translate(-camX, 0);

  // 1. END OF LEVEL: Foundery Sanctuary
  const sc = world.sanctuary;
  ctx.fillStyle = '#1c293d';
  ctx.fillRect(sc.x, 90, sc.w, 170);
  // Stained Glass Cathedral A-Frame
  ctx.fillStyle = '#e85d1d';
  ctx.beginPath();
  ctx.moveTo(sc.x - 10, 90);
  ctx.lineTo(sc.x + sc.w / 2, 20);
  ctx.lineTo(sc.x + sc.w + 10, 90);
  ctx.fill();
  // Glowing Center Emblem
  ctx.fillStyle = '#ffc933';
  ctx.beginPath();
  ctx.arc(sc.x + sc.w / 2, 70, 22, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#e85d1d';
  ctx.font = 'bold 20px "Outfit", sans-serif';
  ctx.fillText('F', sc.x + sc.w/2 - 7, 78);
  // Welcome Arch
  ctx.fillStyle = '#0d1522';
  ctx.fillRect(sc.x + sc.w/2 - 20, 180, 40, 80);
  ctx.fillStyle = '#fff4db';
  ctx.font = '6px "Press Start 2P"';
  ctx.fillText('FOUNDERY', sc.x + 38, 140);
  ctx.fillText('CHURCH', sc.x + 44, 152);

  // 2. FINISH LINE FLAGPOLE
  const fl = world.flag;
  ctx.fillStyle = '#a0b3cc';
  ctx.fillRect(fl.x, 120, 4, fl.poleH);
  ctx.fillStyle = '#ffc933';
  ctx.beginPath();
  ctx.arc(fl.x + 2, 116, 5, 0, Math.PI * 2);
  ctx.fill();

  // Foundery "F" Flag
  ctx.fillStyle = '#e85d1d';
  ctx.fillRect(fl.x + 4, fl.flagY, 34, 22);
  ctx.fillStyle = '#ffc933';
  ctx.fillRect(fl.x + 4, fl.flagY, 34, 3);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 14px "Outfit", sans-serif';
  ctx.fillText('F', fl.x + 14, fl.flagY + 17);

  // 3. SIGNS
  world.signs.forEach(s => {
    ctx.fillStyle = '#2d1a0e';
    ctx.fillRect(s.x + 48, s.y + 14, 4, 20);
    ctx.fillStyle = '#fff7e8';
    ctx.fillRect(s.x, s.y, 100, 16);
    ctx.strokeStyle = '#e85d1d';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(s.x + 0.5, s.y + 0.5, 99, 15);
    ctx.fillStyle = '#1c2533';
    ctx.font = '5px "Press Start 2P"';
    ctx.fillText(s.text, s.x + 4, s.y + 11);
  });

  // 4. MINISTRY DOORS
  world.doors.forEach(d => drawMinistryDoor(ctx, d));

  // 5. PLATFORMS
  world.platforms.forEach(p => drawPlatform(ctx, p));

  // 6. BLOCKS
  world.blocks.forEach(b => {
    if (b.type === 'faith') {
      drawFaithBlock(ctx, b.x, b.y, b.hit, b.bounce, globalTick);
    } else {
      // 16-bit Steel Structural Brick
      const by = b.y + b.bounce;
      ctx.fillStyle = '#334d74';
      ctx.fillRect(b.x, by, 20, 20);
      ctx.fillStyle = '#4c6c9e';
      ctx.fillRect(b.x, by, 20, 2);
      ctx.fillRect(b.x, by, 2, 20);
      ctx.fillStyle = '#1d2f47';
      ctx.fillRect(b.x, by + 18, 20, 2);
      ctx.fillRect(b.x + 18, by, 2, 20);
      ctx.fillStyle = '#e85d1d';
      ctx.fillRect(b.x + 3, by + 5, 6, 3);
      ctx.fillRect(b.x + 11, by + 12, 6, 3);
    }
  });

  // 7. POWER-UP ITEMS
  world.items.forEach(it => {
    if (it.type === 'coffee') drawCoffee(ctx, it.x, it.y, globalTick);
    if (it.type === 'flame') drawFlameIcon(ctx, it.x, it.y, globalTick);
  });

  // 8. ENEMIES
  world.enemies.forEach(e => {
    if (e.type === 'cable') drawCableMonster(ctx, e, globalTick);
    if (e.type === 'battery') drawBatteryMonster(ctx, e, globalTick);
    if (e.type === 'glitch' || e.type === 'clock') drawGlitchMonster(ctx, e, globalTick);
  });

  // 9. OBSTACLES
  world.obstacles.forEach(o => {
    if (o.type === 'ball') {
      // Rolling basketball
      ctx.save();
      ctx.translate(o.x, o.y);
      ctx.rotate(o.rot);
      ctx.fillStyle = '#e85d1d';
      ctx.beginPath();
      ctx.arc(0, 0, o.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#111';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.arc(0, 0, o.r, 0, Math.PI * 2);
      ctx.moveTo(-o.r, 0); ctx.lineTo(o.r, 0);
      ctx.stroke();
      ctx.restore();
    } else {
      // Road Camera Hardcase
      ctx.fillStyle = '#1c222c';
      ctx.fillRect(o.x - o.w/2, o.y - o.h/2, o.w, o.h);
      ctx.strokeStyle = '#9cb4d8';
      ctx.strokeRect(o.x - o.w/2 + 0.5, o.y - o.h/2 + 0.5, o.w - 1, o.h - 1);
      ctx.fillStyle = '#e85d1d';
      ctx.fillRect(o.x - 3, o.y - 2, 6, 4);
    }
  });

  // 10. PROJECTILE FIREBALLS
  fireballs.forEach(fb => {
    ctx.fillStyle = '#ffc933';
    ctx.beginPath();
    ctx.arc(fb.x, fb.y, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#e85d1d';
    ctx.beginPath();
    ctx.arc(fb.x, fb.y, 3, 0, Math.PI * 2);
    ctx.fill();
  });

  // 11. PARTICLES
  world.particles.forEach(p => {
    if (p.type === 'token') drawToken(ctx, p.x, p.y, globalTick);
  });

  // 12. VOLUNTEER CHARACTER
  if (player.invuln % 6 < 3) {
    drawVolunteer(
      ctx,
      player.x,
      player.y,
      player.tier,
      player.facingRight,
      Math.abs(player.vx) > 0.1,
      player.grounded,
      player.animTick
    );
  }

  ctx.restore();

  // --- 16-BIT HUD HEADER ---
  ctx.fillStyle = '#ffc933';
  ctx.font = '7px "Press Start 2P"';
  ctx.fillText('MEDIA VOLUNTEER', 14, 18);
  ctx.fillStyle = '#fff4db';
  ctx.fillText(String(score).padStart(6, '0'), 14, 30);

  // Glowing "F" Token Counter
  drawToken(ctx, 140, 14, globalTick);
  ctx.fillStyle = '#fff4db';
  ctx.fillText('×' + String(tokens).padStart(2, '0'), 160, 25);

  // World Stage
  ctx.fillStyle = '#ffc933';
  ctx.fillText('FOUNDERY', 228, 18);
  ctx.fillStyle = '#fff4db';
  ctx.fillText('STAGE 1-1', 228, 30);

  // Power Level
  ctx.fillStyle = '#ffc933';
  ctx.fillText('POWER', 320, 18);
  ctx.fillStyle = '#e85d1d';
  ctx.fillText(player.tier === 2 ? 'FLAME' : (player.tier === 1 ? 'COFFEE' : 'NORMAL'), 320, 30);

  // Victory Card Overlay
  if (victory) {
    ctx.fillStyle = 'rgba(13, 21, 34, 0.94)';
    ctx.fillRect(40, 60, 320, 170);
    ctx.strokeStyle = '#ffc933';
    ctx.lineWidth = 3;
    ctx.strokeRect(40, 60, 320, 170);

    ctx.fillStyle = '#e85d1d';
    ctx.font = '12px "Press Start 2P"';
    ctx.fillText('SERVICE COMPLETE!', 78, 100);

    ctx.fillStyle = '#fff4db';
    ctx.font = '7px "Press Start 2P"';
    ctx.fillText('SUNDAYS ARE JUST THE START', 68, 130);
    ctx.fillText('MORE THAN A SUNDAY CHURCH', 72, 148);

    ctx.fillStyle = '#ffc933';
    ctx.font = '9px "Press Start 2P"';
    ctx.fillText(`FINAL SCORE: ${score}`, 110, 185);
  }
}

// --- ENGINE LOOP ---
function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>

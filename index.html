<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Super Mario - Mobile & Desktop Playable</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  body {
    background: #111;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
    touch-action: none;
    font-family: 'Courier New', Courier, monospace;
  }
  #game-wrapper {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 600px;
  }
  #canvas-container {
    position: relative;
    width: 100%;
    background: #5c94fc;
    box-shadow: 0 8px 30px rgba(0,0,0,0.8);
    border: 3px solid #222;
    border-radius: 4px;
    line-height: 0;
    aspect-ratio: 256 / 224;
  }
  canvas {
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    display: block;
  }

  /* Mobile On-Screen Controller */
  #touch-controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    padding: 18px 24px;
    margin-top: 8px;
    touch-action: none;
  }
  .dpad {
    display: flex;
    gap: 12px;
  }
  .btn {
    width: 58px;
    height: 58px;
    background: #2a2a2a;
    border: 3px solid #444;
    border-radius: 50%;
    color: #fff;
    font-size: 20px;
    font-weight: bold;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 4px 8px rgba(0,0,0,0.5);
    cursor: pointer;
    transition: transform 0.05s, background 0.05s;
  }
  .btn:active, .btn.pressed {
    background: #444;
    transform: scale(0.92);
    border-color: #666;
  }
  .btn-jump {
    width: 68px;
    height: 68px;
    background: #d82800;
    border-color: #f85830;
    font-size: 16px;
    letter-spacing: 1px;
  }
  .btn-jump:active, .btn-jump.pressed {
    background: #a81000;
  }
</style>
</head>
<body>

<div id="game-wrapper">
  <div id="canvas-container">
    <canvas id="canvas" width="256" height="224"></canvas>
  </div>

  <div id="touch-controls">
    <div class="dpad">
      <div class="btn" id="btn-left">◀</div>
      <div class="btn" id="btn-right">▶</div>
    </div>
    <div class="btn btn-jump" id="btn-jump">JUMP</div>
  </div>
</div>

// --- AUDIO SYNTHESIS ---
const AudioEngine = {
  ctx: null,
  init() {
    if (!this.ctx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (AudioContext) this.ctx = new AudioContext();
    }
  },
  playJump() {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(140, now);
    osc.frequency.exponentialRampToValueAtTime(560, now + 0.16);
    gain.gain.setValueAtTime(0.08, now);
    gain.gain.linearRampToValueAtTime(0, now + 0.16);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.16);
  },
  playStomp() {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(120, now);
    osc.frequency.exponentialRampToValueAtTime(30, now + 0.12);
    gain.gain.setValueAtTime(0.12, now);
    gain.gain.linearRampToValueAtTime(0, now + 0.12);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.12);
  },
  playCoin() {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(987.77, now);
    osc.frequency.setValueAtTime(1318.51, now + 0.08);
    gain.gain.setValueAtTime(0.08, now);
    gain.gain.linearRampToValueAtTime(0, now + 0.35);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.35);
  },
  playBump() {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(240, now);
    osc.frequency.exponentialRampToValueAtTime(60, now + 0.08);
    gain.gain.setValueAtTime(0.08, now);
    gain.gain.linearRampToValueAtTime(0, now + 0.08);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.08);
  }
};

window.addEventListener('click', () => AudioEngine.init(), { once: true });
window.addEventListener('touchstart', () => AudioEngine.init(), { once: true });

// --- INPUT HANDLER (Keyboard + Multi-touch) ---
const keys = { left: false, right: false, jump: false };

window.addEventListener('keydown', (e) => {
  AudioEngine.init();
  if (['ArrowLeft', 'KeyA'].includes(e.code)) keys.left = true;
  if (['ArrowRight', 'KeyD'].includes(e.code)) keys.right = true;
  if (['ArrowUp', 'KeyW', 'Space'].includes(e.code)) keys.jump = true;
});

window.addEventListener('keyup', (e) => {
  if (['ArrowLeft', 'KeyA'].includes(e.code)) keys.left = false;
  if (['ArrowRight', 'KeyD'].includes(e.code)) keys.right = false;
  if (['ArrowUp', 'KeyW', 'Space'].includes(e.code)) keys.jump = false;
});

function bindTouch(elementId, actionKey) {
  const btn = document.getElementById(elementId);
  const press = (e) => {
    e.preventDefault();
    AudioEngine.init();
    keys[actionKey] = true;
    btn.classList.add('pressed');
  };
  const release = (e) => {
    e.preventDefault();
    keys[actionKey] = false;
    btn.classList.remove('pressed');
  };
  btn.addEventListener('touchstart', press, { passive: false });
  btn.addEventListener('touchend', release, { passive: false });
  btn.addEventListener('touchcancel', release, { passive: false });
}

bindTouch('btn-left', 'left');

// --- PIXEL SPRITE FACTORY ---
function createPixelSprite(width, height, pixelMap, palette) {
  const c = document.createElement('canvas');
  c.width = width;
  c.height = height;
  const pctx = c.getContext('2d');
  for (let y = 0; y < height; y++) {
    const row = pixelMap[y];
    if (!row) continue;
    for (let x = 0; x < width; x++) {
      const char = row[x];
      if (char && char !== '.' && palette[char]) {
        pctx.fillStyle = palette[char];
        pctx.fillRect(x, y, 1, 1);
      }
    }
  }
  return c;
}

function drawQuestionBlock(ctx, x, y) {
  ctx.fillStyle = C.qYellow;
  ctx.fillRect(x, y, 16, 16);
  ctx.fillStyle = C.qDark;
  ctx.strokeRect(x + 0.5, y + 0.5, 15, 15);
  ctx.fillRect(x + 1, y + 1, 1, 1);
  ctx.fillRect(x + 14, y + 1, 1, 1);
  ctx.fillRect(x + 1, y + 14, 1, 1);
  ctx.fillRect(x + 14, y + 14, 1, 1);
  ctx.fillStyle = C.black;
  ctx.fillRect(x + 5, y + 3, 6, 2);
  ctx.fillRect(x + 9, y + 5, 3, 3);
  ctx.fillRect(x + 6, y + 7, 4, 2);
  ctx.fillRect(x + 6, y + 9, 3, 2);
  ctx.fillRect(x + 6, y + 12, 3, 2);
}

function drawEmptyBlock(ctx, x, y) {
  ctx.fillStyle = C.qEmpty;
  ctx.fillRect(x, y, 16, 16);
  ctx.fillStyle = '#4c2800';
  ctx.strokeRect(x + 0.5, y + 0.5, 15, 15);
  ctx.fillRect(x + 1, y + 1, 2, 2);
  ctx.fillRect(x + 13, y + 1, 2, 2);
  ctx.fillRect(x + 1, y + 13, 2, 2);
  ctx.fillRect(x + 13, y + 13, 2, 2);
}

function drawBrickBlock(ctx, x, y) {
  ctx.fillStyle = C.brickDark;
  ctx.fillRect(x, y, 16, 16);
  ctx.fillStyle = C.brickLight;
  ctx.fillRect(x + 1, y + 1, 6, 3);
  ctx.fillRect(x + 9, y + 1, 6, 3);
  ctx.fillRect(x + 1, y + 5, 2, 3);
  ctx.fillRect(x + 5, y + 5, 6, 3);
  ctx.fillRect(x + 13, y + 5, 2, 3);
  ctx.fillRect(x + 1, y + 9, 6, 3);
  ctx.fillRect(x + 9, y + 9, 6, 3);
  ctx.fillRect(x + 1, y + 13, 2, 2);
  ctx.fillRect(x + 5, y + 13, 6, 2);
  ctx.fillRect(x + 13, y + 13, 2, 2);
  ctx.fillStyle = C.brickLine;
  ctx.fillRect(x, y + 4, 16, 1);
  ctx.fillRect(x, y + 8, 16, 1);
  ctx.fillRect(x, y + 12, 16, 1);
  ctx.fillRect(x + 8, y, 1, 4);
  ctx.fillRect(x + 4, y + 4, 1, 4);
  ctx.fillRect(x + 12, y + 4, 1, 4);
  ctx.fillRect(x + 8, y + 8, 1, 4);
  ctx.fillRect(x + 4, y + 12, 1, 4);
  ctx.fillRect(x + 12, y + 12, 1, 4);
}

function drawPipe(ctx, x, y, height) {
  const topH = 15;
  ctx.fillStyle = C.pipeGreen;
  ctx.fillRect(x - 2, y, 36, topH);
  ctx.fillStyle = C.pipeLight;
  ctx.fillRect(x, y + 2, 4, topH - 4);
  ctx.fillStyle = C.pipeDark;
  ctx.fillRect(x + 28, y + 1, 4, topH - 2);
  ctx.fillStyle = C.black;
  ctx.strokeRect(x - 1.5, y + 0.5, 35, topH - 1);

  const shaftH = height - topH;
  ctx.fillStyle = C.pipeGreen;
  ctx.fillRect(x, y + topH, 32, shaftH);
  ctx.fillStyle = C.pipeLight;
  ctx.fillRect(x + 2, y + topH, 4, shaftH);
  ctx.fillStyle = C.pipeDark;
  ctx.fillRect(x + 26, y + topH, 4, shaftH);
  ctx.fillStyle = C.black;
  ctx.strokeRect(x + 0.5, y + topH - 0.5, 31, shaftH);
}

function drawCloud(ctx, x, y) {
  ctx.fillStyle = C.cloudWhite;
  ctx.beginPath();
  ctx.arc(x + 12, y + 12, 10, 0, Math.PI * 2);
  ctx.arc(x + 24, y + 8, 12, 0, Math.PI * 2);
  ctx.arc(x + 36, y + 12, 10, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillRect(x + 10, y + 10, 28, 8);
}

function drawHill(ctx, x, y, r) {
  ctx.fillStyle = C.hillGreen;
  ctx.beginPath();
  ctx.arc(x, y + r, r, Math.PI, 0);
  ctx.fill();
  ctx.strokeStyle = C.hillBorder;
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.fillStyle = C.hillBorder;
  ctx.fillRect(x - 2, y + 8, 4, 3);
  ctx.fillRect(x - r / 2, y + r / 2, 4, 3);
  ctx.fillRect(x + r / 2 - 4, y + r / 2, 4, 3);
}

let world = createWorld();

// Playable Mario State
const mario = {
  x: 40,
  y: 184,
  vx: 0,
  vy: 0,
  speed: 1.8,
  grounded: true,
  facingRight: true,
  frameTimer: 0,
  animFrame: 0,
  canJump: true
};

let globalFrame = 0;

function update() {
  globalFrame++;

  // Horizontal Movement
  if (keys.left) {
    mario.vx = -mario.speed;
    mario.facingRight = false;
  } else if (keys.right) {
    mario.vx = mario.speed;
    mario.facingRight = true;
  } else {
    mario.vx = 0;
  }

  // Jump Input
  if (keys.jump && mario.grounded && mario.canJump) {
    mario.vy = -5.6;
    mario.grounded = false;
    mario.canJump = false;
    AudioEngine.playJump();
  }
  if (!keys.jump) {
    mario.canJump = true;
  }

  // Gravity
  if (!mario.grounded) {
    mario.vy += 0.28;
  }

  // Next proposed position
  const nextX = mario.x + mario.vx;
  const nextY = mario.y + mario.vy;

  // Ground level
  const groundLevel = 184;
  let floorY = groundLevel;

  // Pipe Solid Collisions
  world.pipes.forEach(pipe => {
    const pipeTop = 200 - pipe.h;
    const pipeLeft = pipe.x - 2;
    const pipeRight = pipe.x + 34;

    // Side collision
    if (nextY + 16 > pipeTop && mario.y < 200) {
      if (mario.vx > 0 && mario.x + 14 <= pipeLeft && nextX + 14 >= pipeLeft) {
        mario.vx = 0;
      } else if (mario.vx < 0 && mario.x + 2 >= pipeRight && nextX + 2 <= pipeRight) {
        mario.vx = 0;
      }
    }

    // Top collision
    if (mario.x + 12 > pipe.x && mario.x + 4 < pipe.x + 32) {
      if (mario.y + 16 <= pipeTop + 6 && mario.vy >= 0) {
        floorY = Math.min(floorY, pipeTop - 16);
      }
    }
  });

  // Apply horizontal movement
  mario.x += mario.vx;
  if (mario.x < 0) mario.x = 0;

  // Block Collisions
  world.blocks.forEach(b => {
    // Underneath bump
    if (mario.vy < 0 && mario.x + 12 > b.x && mario.x + 4 < b.x + 16) {
      if (mario.y <= b.y + 16 && mario.y >= b.y + 8) {
        mario.y = b.y + 16;
        mario.vy = 1;
        b.bounce = -4;
        AudioEngine.playBump();

        if (!b.hit) {
          b.hit = true;
          if (b.type === '?') {
            AudioEngine.playCoin();
            coins++;
            score += 200;
            world.particles.push({
              x: b.x + 4,
              y: b.y - 12,
              vy: -4,
              timer: 0,
              type: 'coin'
            });
          }
        }
      }
    }

    // Top of block
    if (mario.x + 12 > b.x && mario.x + 4 < b.x + 16) {
      if (mario.y + 16 <= b.y + 6 && mario.vy >= 0) {
        floorY = Math.min(floorY, b.y - 16);
      }
    }

    if (b.bounce < 0) b.bounce += 0.5;
    else b.bounce = 0;
  });

  // Apply Vertical movement
  mario.y += mario.vy;

  if (mario.y >= floorY) {
    mario.y = floorY;
    mario.vy = 0;
    mario.grounded = true;
  } else {
    mario.grounded = false;
  }

  // Piranha Plants
  world.pipes.forEach(pipe => {
    if (pipe.plant) {
      const dist = Math.abs((mario.x + 8) - (pipe.x + 16));
      if (dist < 48) {
        if (pipe.piranhaY < 24) pipe.piranhaY += 1.2;
      } else {
        if (pipe.piranhaDir === 1) {
          pipe.piranhaY -= 0.35;
          if (pipe.piranhaY <= -20) pipe.piranhaDir = -1;
        } else {
          pipe.piranhaY += 0.35;
          if (pipe.piranhaY >= 20) pipe.piranhaDir = 1;
        }
      }
    }
  });

  // Goombas stomp & walking
  world.goombas.forEach(g => {
    if (g.state === 'walk') {
      g.x += g.vx;
      g.anim += 0.08;

      if (
        mario.x + 12 > g.x &&
        mario.x + 4 < g.x + 16 &&
        mario.y + 16 >= g.y &&
        mario.y + 16 <= g.y + 10 &&
        mario.vy > 0
      ) {
        g.state = 'flat';
        mario.vy = -3.8;
        score += 100;
        AudioEngine.playStomp();
      }
    } else if (g.state === 'flat') {
      g.timer++;
    }
  });

  // Particle updates
  for (let i = world.particles.length - 1; i >= 0; i--) {
    const p = world.particles[i];
    p.y += p.vy;
    p.vy += 0.25;
    p.timer++;
    if (p.timer > 30) world.particles.splice(i, 1);
  }

  // Mario Animation frames
  if (mario.grounded && mario.vx !== 0) {
    mario.frameTimer += 0.2;
    mario.animFrame = Math.floor(mario.frameTimer) % 3;
  } else if (mario.grounded) {
    mario.animFrame = 0;
  }

  // Seamless World End Reset
  if (mario.x >= LEVEL_LENGTH) {
    mario.x = 40;
    world = createWorld();
  }
}

function render() {
  ctx.fillStyle = C.sky;
  ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

  const cameraX = Math.max(0, mario.x - 90);

  // Parallax Clouds
  const cloudOffset = -(cameraX * 0.2) % 300;
  for (let cx = cloudOffset - 100; cx < V_WIDTH + 100; cx += 150) {
    drawCloud(ctx, cx, 32);
    drawCloud(ctx, cx + 80, 52);
  }

  // Parallax Hills
  const hillOffset = -(cameraX * 0.4) % 250;
  for (let hx = hillOffset - 80; hx < V_WIDTH + 80; hx += 160) {
    drawHill(ctx, hx, 150, 48);
    drawHill(ctx, hx + 90, 166, 32);
  }

  // Ground Tiles
  ctx.fillStyle = C.groundTop;
  ctx.fillRect(0, 200, V_WIDTH, 4);
  ctx.fillStyle = C.groundDark;
  ctx.fillRect(0, 204, V_WIDTH, 20);

  ctx.fillStyle = C.brickLine;
  const groundTileOffset = -cameraX % 16;
  for (let gx = groundTileOffset; gx < V_WIDTH; gx += 16) {
    ctx.fillRect(gx, 200, 1, 24);
    ctx.fillRect(gx, 212, 16, 1);
  }

  ctx.save();
  ctx.translate(-cameraX, 0);

  // Render Blocks
  world.blocks.forEach(b => {
    const drawY = b.y + b.bounce;
    if (b.type === '?') {
      if (b.hit) drawEmptyBlock(ctx, b.x, drawY);
      else drawQuestionBlock(ctx, b.x, drawY);
    } else if (b.type === 'brick') {
      drawBrickBlock(ctx, b.x, drawY);
    }
  });

  // Render Pipes & Plants
  world.pipes.forEach(pipe => {
    const pipeTop = 200 - pipe.h;
    if (pipe.plant) {
      const piranhaSprite = Math.floor(globalFrame / 10) % 2 === 0 ? piranha1 : piranha2;
      ctx.drawImage(piranhaSprite, pipe.x + 8, pipeTop + pipe.piranhaY);
    }
    drawPipe(ctx, pipe.x, pipeTop, pipe.h);
  });

  // Render Goombas
  world.goombas.forEach(g => {
    if (g.state === 'walk') {
      const frame = Math.floor(g.anim) % 2 === 0 ? goomba1 : goomba2;
      ctx.drawImage(frame, g.x, g.y);
    } else if (g.state === 'flat' && g.timer < 30) {
      ctx.drawImage(goombaFlat, g.x, g.y + 6);
    }
  });

  // Render Coin Particles
  world.particles.forEach(p => {
    if (p.type === 'coin') {
      ctx.fillStyle = C.qYellow;
      const spin = Math.floor(p.timer / 3) % 4;
      const w = spin === 1 || spin === 3 ? 4 : 8;
      ctx.fillRect(p.x + (8 - w) / 2, p.y, w, 12);
      ctx.fillStyle = C.white;
      ctx.fillRect(p.x + (8 - w) / 2 + 1, p.y + 2, 2, 8);
    }
  });

  // Render Mario (with direction flip)
  let marioSprite;
  if (!mario.grounded) {
    marioSprite = marioJump;
  } else if (mario.vx !== 0) {
    marioSprite = [marioRun1, marioRun2, marioRun3][mario.animFrame];
  } else {
    marioSprite = marioRun1;
  }

  ctx.save();
  if (!mario.facingRight) {
    ctx.translate(mario.x + 16, mario.y);
    ctx.scale(-1, 1);
    ctx.drawImage(marioSprite, 0, 0);
  } else {
    ctx.drawImage(marioSprite, mario.x, mario.y);
  }
  ctx.restore();

  ctx.restore();

  // Retro HUD
  ctx.font = 'bold 8px "Courier New", monospace';
  ctx.fillStyle = C.white;
  ctx.fillText('MARIO', 24, 16);
  ctx.fillText(String(score).padStart(6, '0'), 24, 26);

  ctx.fillStyle = C.qYellow;
  ctx.fillRect(96, 20, 6, 6);
  ctx.fillStyle = C.white;
  ctx.fillText('×' + String(coins).padStart(2, '0'), 105, 26);

  ctx.fillText('WORLD', 152, 16);
  ctx.fillText('1-1', 160, 26);

  ctx.fillText('TIME', 208, 16);
  ctx.fillText('374', 212, 26);
}

function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
